name: Materialize reviewed pricing clarity on remediation branch
on:
  push:
    branches: [fix/pricing-content-parity-20261006]
    paths:
      - tools/reconcile-pricing-clarity-20261006.py
      - tools/content/pricing-clarity-20261006.json
      - .github/workflows/materialize-pricing-clarity-once.yml
permissions:
  contents: read
concurrency:
  group: pricing-clarity-materialization-20261006
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == '880rzz/BANHALMI-C' && github.ref == 'refs/heads/fix/pricing-content-parity-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify base and apply reviewed non-monetary copy
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/pricing-content-parity-20261006
          git merge-base --is-ancestor 9f55a682a0f9f2dbbbe7fc2cb9b542ca40d4f21b HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tools/content/pricing-clarity-20261006.json')
          d=json.loads(p.read_text())
          d['hu']['eventShort']='Business Event bruttó 196 000 Ft-tól (€490); C-Level / intézményi fotózás bruttó 236 000 Ft-tól (€590). Eltérő feladat, nem kedvezmény.'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python3 tools/reconcile-pricing-clarity-20261006.py --apply | tee /tmp/clarity-changes.json
          python3 tools/reconcile-pricing-clarity-20261006.py --check
          git diff --check
          python3 - <<'PY'
          import json, subprocess
          paths=json.load(open('/tmp/clarity-changes.json'))['modified']
          paths.append('tools/content/pricing-clarity-20261006.json')
          fixed={'requestaquote/index.html','hu/ajanlatkeres/index.html','de-at/anfrage/index.html','terms-conditions/index.html','hu/aszf/index.html','de-at/agb/index.html','fine-art/index.html','hu/muveszi-fotografia/index.html','de-at/fine-art/index.html','assets/js/mega-menu.js','assets/js/mega-menu-v65-base.js','pricing-guide.json','project-policy.json','package.json','tools/content/pricing-clarity-20261006.json'}
          for path in paths:
              assert path in fixed or path.startswith(('tools/generate','tools/apply','tools/restore','tools/simplify','tools/harden','tools/remediate','tools/optimize','scripts/generate','scripts/apply','scripts/restore','scripts/simplify','scripts/harden','scripts/remediate','scripts/optimize')), path
          actual=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(actual)==set(paths),(actual,paths)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          git rm -- .github/workflows/materialize-pricing-clarity-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align HU EN DE pricing copy and machine routing without changing prices'
      - name: Install existing audit dependencies
        run: npm ci
      - name: Run every existing source gate plus new clarity regression
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/clarity-source-audits.log
      - name: Publish only the tested remediation branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/pricing-content-parity-20261006
          git diff --exit-code
          git push origin HEAD:refs/heads/fix/pricing-content-parity-20261006
      - name: Preserve review evidence without Git metadata or credentials
        if: always()
        shell: bash
        run: |
          git archive --format=tar.gz -o /tmp/clarity-source.tar.gz HEAD
          git diff > /tmp/clarity-uncommitted.diff
          git rev-parse HEAD > /tmp/clarity-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pricing-clarity-materialization-${{ github.sha }}
          retention-days: 3
          path: |
            /tmp/clarity-source.tar.gz
            /tmp/clarity-source-sha.txt
            /tmp/clarity-changes.json
            /tmp/clarity-source-audits.log
            /tmp/clarity-uncommitted.diff
