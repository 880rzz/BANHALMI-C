name: Materialize and test reviewed audience journeys
on:
  push:
    branches: [build/audience-journeys-20261006]
    paths: [.github/workflows/materialize-audience-journeys-once.yml]
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == '880rzz/BANHALMI-C' && github.ref == 'refs/heads/build/audience-journeys-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact reviewed migration, never write main or PR119
        env:
          AUDIENCE_BUNDLE: >-
            
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/build/audience-journeys-20261006
          test "$(cat CNAME)" = www.norbertbanhalmi.com
          git merge-base --is-ancestor 3b5756cb8496e3829f1e84a9576046949bc35af1 HEAD
          mkdir -p /tmp/audience-evidence
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(os.environ['AUDIENCE_BUNDLE']))
          assert hashlib.sha256(raw).hexdigest()=='b35423275b8d79ed57d0199d528f328b05f280d6be5ff89066c0672db84f9065'
          b=json.loads(raw)
          allowed={'tools/content/audience-journeys-20261006.json','tools/audit-audience-journeys.mjs','tests/audience-journeys.spec.mjs'}
          assert set(b['files'])==allowed
          for path,text in b['files'].items():
              p=Path(path);assert not p.exists(),path;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          Path('/tmp/apply-audience-journeys.py').write_text(b['compiler'])
          subprocess.run(['python3','/tmp/apply-audience-journeys.py','.', 'tools/content/audience-journeys-20261006.json'],check=True)
          PY
          git rm .github/workflows/materialize-audience-journeys-once.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = 71f646fc21df73160fd1b78400b224707952f511
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize reviewed audience-journey candidate for independent validation'
          git rev-parse HEAD > /tmp/audience-evidence/candidate-commit.txt
          git rev-parse HEAD^{tree} > /tmp/audience-evidence/candidate-tree.txt
      - run: npm ci
      - name: Run every source contract including audience routing
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/audience-evidence/source-tests.log
      - run: npx playwright install --with-deps chromium webkit
      - name: Run all browser interactions and audience screenshots
        shell: bash
        run: |
          set -euo pipefail
          node tools/perf-static-server.mjs . 4173 > /tmp/audience-evidence/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS --max-time 2 http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          npm run test:e2e 2>&1 | tee /tmp/audience-evidence/e2e.log
          AUDIT_BASE_URL=http://127.0.0.1:4173 AUDIT_SITE_DIR=. node tools/audit-webkit-footer-tail.mjs 2>&1 | tee /tmp/audience-evidence/webkit.log
      - name: Publish tested candidate only; release branch still unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/build/audience-journeys-20261006
          git diff --exit-code
          test "$(git rev-parse HEAD^{tree})" = 71f646fc21df73160fd1b78400b224707952f511
          git push origin HEAD:refs/heads/build/audience-journeys-reviewed-20261006
      - name: Preserve exact evidence
        if: always()
        run: |
          git diff > /tmp/audience-evidence/uncommitted.diff
          git show --stat HEAD > /tmp/audience-evidence/changes.txt
          cp -R artifacts/audience-journeys /tmp/audience-evidence/screenshots 2>/dev/null || true
          cp -R test-results /tmp/audience-evidence/test-results 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audience-journeys-${{ github.sha }}
          path: /tmp/audience-evidence
          retention-days: 3
